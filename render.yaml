services:
  - type: web
    name: ids26-c8q1-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SIMULATION_SEED
        value: 3811
      - key: MIN_SPEED_KMH
        value: 30
      - key: MAX_SPEED_KMH
        value: 60
      - key: SIMULATION_INTERVAL_SECONDS
        value: 2
      - key: FEW_SAMPLES_THRESHOLD
        value: 5
      - key: HIGH_SPEED_WARNING_PERCENT
        value: 25
      - key: REPORT_DIFFERENCE_THRESHOLD_KMH
        value: 2
      - key: CORS_ORIGINS
        value: "*"
